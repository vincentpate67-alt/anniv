<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Joyeux anniversaire</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page-shell">
    <div class="stars"></div>
    <div class="glow"></div>
    <div id="backgroundSprites" class="background-sprites" aria-hidden="true"></div>
    <main class="hero">
      <div class="hero__content">
        <p class="subtitle">Découvres ton skibidi cadeau</p>
        <h1 class="title">joyeux anniv wesh</h1>
        <div class="buttons">
          <button id="btnAntoine" class="button">Antoine</button>
          <button id="btnArthur" class="button">Arthur</button>
        </div>
        <div id="audioControls" class="audio-controls" aria-hidden="true">
          <label for="volumeSlider">Volume</label>
          <input id="volumeSlider" type="range" min="0" max="1" step="0.01" value="0.75" />
          <span id="volumeLabel">75%</span>
        </div>
        <div id="audioStatus" class="audio-status" aria-live="polite"></div>
        <canvas id="waveCanvas" class="wave-canvas" aria-hidden="true"></canvas>
      </div>
    </main>
  </div>
  <audio id="audioAntoine" src="FF.mp3" preload="auto"></audio>
  <audio id="audioArthur" src="test.mp3" preload="auto"></audio>
  <script src="script.js"></script>
</body>
</html>
